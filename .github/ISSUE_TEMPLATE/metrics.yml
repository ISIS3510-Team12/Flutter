name: Contribution Metrics
description: Request an adjustment to contribution metrics.
title: "[metrics]: request contribution metric adjustment"
labels:
  - project-maintenance
projects:
  - ISIS3510-Team12/4
body:
  - type: textarea
    id: commits
    attributes:
      label: Commits or changes to review
      description: Identify the commits or changes related to this metric request.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason for adjustment
      description: Explain why the contribution data should be adjusted.
    validations:
      required: true

  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected outcome
      description: Describe how the contribution data should be treated in the metrics.
    validations:
      required: true